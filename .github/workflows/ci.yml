name: ci

#triggers
on:
  # triggers on a push on brnach main
  push:
    branches:
      - main
  # triggers on a pull request
  pull_request:

#jobs
jobs:
  #job name
  lint:
    # os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: make lint